<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Four Pro</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        p1: {
                            DEFAULT: '#EF4444', // Vibrant Red
                            glow: 'rgba(239, 68, 68, 0.6)',
                            hover: '#DC2626'
                        },
                        p2: {
                            DEFAULT: '#EAB308', // Vibrant Yellow
                            glow: 'rgba(234, 179, 8, 0.6)',
                            hover: '#CA8A04'
                        },
                        board: {
                            bg: '#1E293B',
                            slot: '#0F172A'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        /* Disc Fall Animation */
        @keyframes discDrop {
            0% {
                transform: translateY(var(--drop-start, -300px));
                animation-timing-function: cubic-bezier(0.55, 0.055, 0.675, 0.19);
            }
            60% {
                transform: translateY(0);
                animation-timing-function: cubic-bezier(0.215, 0.61, 0.355, 1);
            }
            75% {
                transform: translateY(-20px);
                animation-timing-function: cubic-bezier(0.55, 0.055, 0.675, 0.19);
            }
            90% {
                transform: translateY(0);
                animation-timing-function: cubic-bezier(0.215, 0.61, 0.355, 1);
            }
            97% {
                transform: translateY(-6px);
            }
            100% {
                transform: translateY(0);
            }
        }

        .animate-drop {
            animation: discDrop 0.55s forwards;
        }

        /* Pulsing Glow for Winning Slots */
        @keyframes winPulse {
            0%, 100% {
                transform: scale(1);
                filter: brightness(1.2) drop-shadow(0 0 12px currentColor);
            }
            50% {
                transform: scale(1.08);
                filter: brightness(1.6) drop-shadow(0 0 22px currentColor);
            }
        }

        .winning-disc {
            animation: winPulse 1.2s infinite ease-in-out;
            z-index: 20 !important;
        }

        /* Board Glass Visuals */
        .board-container {
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5),
                        inset 0 2px 4px rgba(255, 255, 255, 0.1);
        }

        /* Custom Scrollbar for Move History */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(100, 116, 139, 0.5);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(148, 163, 184, 0.8);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col justify-between transition-colors duration-300 relative overflow-x-hidden">

    <!-- Confetti Overlay Canvas -->
    <canvas id="confettiCanvas" class="fixed inset-0 pointer-events-none z-50 w-full h-full"></canvas>

    <!-- Header Section -->
    <header class="w-full max-w-5xl mx-auto px-4 py-4 flex justify-between items-center z-10">

                <i class="fas fa-circle-nodes"></i>
            </div>
            <div>

        </div>

        <div class="flex items-center gap-2 sm:gap-3">
            <button id="soundToggleBtn" class="p-3 rounded-2xl bg-slate-800/80 hover:bg-slate-700/80 dark:bg-slate-800/80 dark:hover:bg-slate-700 border border-slate-700/80 text-slate-300 transition-all shadow-md active:scale-95 focus:outline-none" title="Toggle Sound">

            </button>
            <button id="themeToggleBtn" class="p-3 rounded-2xl bg-slate-800/80 hover:bg-slate-700/80 dark:bg-slate-800/80 dark:hover:bg-slate-700 border border-slate-700/80 text-slate-300 transition-all shadow-md active:scale-95 focus:outline-none" title="Toggle Dark/Light Mode">

    <!-- Main Game Workspace -->
    <main class="w-full max-w-5xl mx-auto px-2 sm:px-4 py-2 flex-grow flex flex-col justify-center items-center gap-4 sm:gap-6 z-10">
        
        <!-- Scoreboard & Active Player Badges -->
        <div class="w-full grid grid-cols-3 gap-2 sm:gap-4 items-center max-w-3xl">
            
            <!-- Player 1 Red -->
            <div id="player1Card" class="p-3 sm:p-4 rounded-2xl transition-all duration-300 border-2 border-p1/60 bg-slate-800/60 backdrop-blur flex flex-col items-center justify-center relative overflow-hidden shadow-lg">
                <div class="absolute top-0 left-0 w-full h-1.5 bg-p1"></div>
                <div class="flex items-center gap-1.5 mb-1 w-full justify-center">
                    <span class="w-3 h-3 rounded-full bg-p1 shadow-[0_0_8px_rgba(239,68,68,0.8)]"></span>
                    <input type="text" id="p1NameInput" value="Player 1" class="bg-transparent border-b border-transparent hover:border-slate-500 focus:border-p1 focus:outline-none text-center font-bold text-xs sm:text-sm md:text-base text-slate-100 w-20 sm:w-28 truncate" title="Rename Player 1">
                    <i class="fas fa-pencil-alt text-[10px] text-slate-500 opacity-60"></i>
                </div>
                <div class="text-2xl sm:text-4xl font-black text-slate-100" id="p1Score">0</div>
                <span class="text-[10px] sm:text-xs text-slate-400 font-semibold tracking-wider uppercase mt-0.5">WINS</span>

            <!-- Ties & Active Turn Indicator -->

                <span class="text-[10px] sm:text-xs font-bold tracking-wider text-slate-400 uppercase">Draws</span>
                <div class="text-lg sm:text-2xl font-black text-slate-300 my-0.5" id="tiesScore">0</div>
                
                <!-- Turn Badge -->
                <div id="turnBadge" class="mt-1 px-2.5 sm:px-3 py-1 rounded-full text-xs font-extrabold bg-p1/20 text-p1 border border-p1/40 flex items-center gap-1.5 transition-all duration-300">
                    <span id="turnDot" class="w-2.5 h-2.5 rounded-full bg-p1 animate-pulse"></span>
                    <span id="turnText" class="truncate max-w-[80px] sm:max-w-[120px]">Player 1</span>

            </div>

            <!-- Player 2 Yellow -->
            <div id="player2Card" class="p-3 sm:p-4 rounded-2xl transition-all duration-300 border-2 border-transparent bg-slate-800/60 backdrop-blur opacity-60 flex flex-col items-center justify-center relative overflow-hidden shadow-lg">
                <div class="absolute top-0 left-0 w-full h-1.5 bg-p2"></div>
                <div class="flex items-center gap-1.5 mb-1 w-full justify-center">
                    <span class="w-3 h-3 rounded-full bg-p2 shadow-[0_0_8px_rgba(234,179,8,0.8)]"></span>
                    <input type="text" id="p2NameInput" value="Player 2" class="bg-transparent border-b border-transparent hover:border-slate-500 focus:border-p2 focus:outline-none text-center font-bold text-xs sm:text-sm md:text-base text-slate-100 w-20 sm:w-28 truncate" title="Rename Player 2">
                    <i class="fas fa-pencil-alt text-[10px] text-slate-500 opacity-60"></i>
                </div>
                <div class="text-2xl sm:text-4xl font-black text-slate-100" id="p2Score">0</div>
                <span class="text-[10px] sm:text-xs text-slate-400 font-semibold tracking-wider uppercase mt-0.5">WINS</span>
            </div>
        </div>

        <!-- Interactive Board & Sidebar Layout -->
        <div class="flex flex-col lg:flex-row gap-6 items-center lg:items-start justify-center w-full max-w-4xl">
            
            <!-- Game Board Wrapper -->
            <div class="flex flex-col items-center w-full max-w-[340px] sm:max-w-[460px] md:max-w-[540px]">
                
                <!-- Hover/Drop Indicator Arrow Track -->
                <div id="indicatorTrack" class="grid grid-cols-7 gap-1 sm:gap-2 w-full px-2 sm:px-3 h-8 sm:h-10 items-center">
                    <!-- Dynamic column hover pointers injected here -->
                </div>

                <!-- 7x6 Connect Four Grid Container -->
                <div class="relative w-full bg-blue-900/90 dark:bg-slate-800 p-2 sm:p-3 md:p-4 rounded-3xl border-4 border-blue-700/60 dark:border-slate-700/80 board-container">
                    
                    <!-- 7 Columns Container -->
                    <div id="gridBoard" class="grid grid-cols-7 gap-1 sm:gap-2 relative z-10">
                        <!-- Columns and slots rendered dynamically -->
                    </div>

                </div>
            </div>

            <!-- Sidebar: Move History Log & Controls -->
            <div class="w-full max-w-[340px] sm:max-w-[460px] lg:w-64 bg-slate-800/50 rounded-2xl border border-slate-700/60 p-4 flex flex-col h-[200px] lg:h-[460px] justify-between shadow-xl">
                <div>
                    <div class="flex items-center justify-between border-b border-slate-700/80 pb-2.5 mb-2.5">
                        <h3 class="text-xs font-black uppercase tracking-wider text-slate-400 flex items-center gap-2">
                            <i class="fas fa-list-ol text-blue-400"></i> Move History
                        </h3>
                        <span id="moveCountBadge" class="text-[11px] font-bold bg-slate-700/80 text-slate-300 px-2.5 py-0.5 rounded-full">0 Moves</span>
                    </div>

                    <!-- Scrollable Log List -->
                    <div id="moveHistoryList" class="overflow-y-auto max-h-[90px] lg:max-h-[300px] space-y-1.5 pr-1 text-xs font-medium">
                        <div class="text-slate-500 italic text-center py-6">No moves made yet</div>
                    </div>
                </div>

                <!-- Action Controls -->
                <div class="pt-3 border-t border-slate-700/80 grid grid-cols-3 gap-2">
                    <button id="undoBtn" disabled class="py-2.5 px-2 rounded-xl bg-slate-700/60 hover:bg-slate-600 disabled:opacity-40 disabled:cursor-not-allowed text-slate-200 font-bold text-xs transition-all active:scale-95 flex items-center justify-center gap-1.5" title="Undo Last Move">
                        <i class="fas fa-rotate-left"></i> Undo
                    </button>
                    <button id="restartBoardBtn" class="py-2.5 px-2 rounded-xl bg-slate-700 hover:bg-slate-600 text-slate-100 font-bold text-xs transition-all active:scale-95 flex items-center justify-center gap-1.5" title="Clear Board">
                        <i class="fas fa-redo-alt"></i> Reset
                    </button>
                    <button id="resetMatchBtn" class="py-2.5 px-2 rounded-xl bg-rose-600/20 hover:bg-rose-600/30 text-rose-300 border border-rose-500/30 font-bold text-xs transition-all active:scale-95 flex items-center justify-center gap-1" title="Reset All Scores & Matches">
                        <i class="fas fa-trash-can"></i> Clear
                    </button>
                </div>
            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full text-center py-4 text-xs font-medium text-slate-500 z-10">
        Connect Four Pro • Standard 7x6 Grid • Local 2 Players
    </footer>

    <!-- Victory / Draw Modal Popup -->
    <div id="gameModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
        <div id="modalContent" class="bg-slate-800/90 border border-slate-700/80 rounded-3xl p-6 sm:p-8 max-w-sm w-full text-center shadow-2xl transform scale-90 transition-transform duration-300">
            
            <div id="winnerAvatar" class="w-20 h-20 mx-auto rounded-3xl flex items-center justify-center text-4xl mb-4 shadow-xl">
                <i id="winnerIcon" class="fas fa-trophy"></i>
            </div>

            <h2 id="modalTitle" class="text-2xl font-black text-slate-100 mb-1">Player 1 Wins!</h2>
            <p id="modalSubtitle" class="text-xs sm:text-sm text-slate-400 mb-6">Connected four discs in a row!</p>

            <div class="flex flex-col gap-2.5">
                <button id="modalNextRoundBtn" class="w-full py-3.5 px-4 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-black text-sm shadow-lg shadow-blue-500/25 transition-all active:scale-95">
                    Next Round
                </button>
                <button id="modalCloseBtn" class="w-full py-2.5 px-4 rounded-xl bg-slate-700/80 hover:bg-slate-600 text-slate-300 font-bold text-xs transition-all">
                    Review Board
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript Game Logic Section -->
    <script>
        // Board Constants
        const ROWS = 6;
        const COLS = 7;

        // Global Application State
        const state = {
            grid: Array(ROWS).fill(null).map(() => Array(COLS).fill(null)), // 6 rows x 7 cols matrix
            currentPlayer: 1, // 1 for Player 1 (Red), 2 for Player 2 (Yellow)
            scores: { p1: 0, p2: 0, ties: 0 },
            playerNames: { 1: 'Player 1', 2: 'Player 2' },
            isGameActive: true,
            isAnimating: false,
            moveHistory: [], // Array of { player, col, row }
            soundEnabled: true,
            theme: 'dark'
        };

        // Web Audio API Sound Synthesizer Class
        class AudioEngine {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
            }

            // Play synthesized token drop thump sound
            playDrop() {
                if (!state.soundEnabled) return;
                this.init();
                if (!this.ctx) return;

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.type = 'sine';
                osc.frequency.setValueAtTime(220, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(60, this.ctx.currentTime + 0.12);

                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.12);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.12);
            }

            // Play Victory Tune
            playWin() {
                if (!state.soundEnabled) return;
                this.init();
                if (!this.ctx) return;

                const arpeggio = [392.00, 493.88, 587.33, 783.99]; // G Major Arpeggio
                arpeggio.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.09);

                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime + idx * 0.09);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.09 + 0.35);

                    osc.start(this.ctx.currentTime + idx * 0.09);
                    osc.stop(this.ctx.currentTime + idx * 0.09 + 0.35);
                });
            }

            // Play Draw Sound
            playDraw() {
                if (!state.soundEnabled) return;
                this.init();
                if (!this.ctx) return;

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(280, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(140, this.ctx.currentTime + 0.35);

                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.35);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.35);
            }

            // Generic Button Click Sound
            playClick() {
                if (!state.soundEnabled) return;
                this.init();
                if (!this.ctx) return;

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.05);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.05);
            }
        }

        const audio = new AudioEngine();

        // DOM Elements
        const gridBoard = document.getElementById('gridBoard');
        const indicatorTrack = document.getElementById('indicatorTrack');
        const p1Card = document.getElementById('player1Card');
        const p2Card = document.getElementById('player2Card');
        const p1NameInput = document.getElementById('p1NameInput');
        const p2NameInput = document.getElementById('p2NameInput');
        const p1ScoreEl = document.getElementById('p1Score');
        const p2ScoreEl = document.getElementById('p2Score');
        const tiesScoreEl = document.getElementById('tiesScore');
        const turnBadge = document.getElementById('turnBadge');
        const turnDot = document.getElementById('turnDot');
        const turnText = document.getElementById('turnText');
        const moveHistoryList = document.getElementById('moveHistoryList');
        const moveCountBadge = document.getElementById('moveCountBadge');
        const undoBtn = document.getElementById('undoBtn');
        const restartBoardBtn = document.getElementById('restartBoardBtn');
        const resetMatchBtn = document.getElementById('resetMatchBtn');
        const soundToggleBtn = document.getElementById('soundToggleBtn');
        const soundIcon = document.getElementById('soundIcon');
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const themeIcon = document.getElementById('themeIcon');

        // Modal Elements
        const gameModal = document.getElementById('gameModal');
        const modalContent = document.getElementById('modalContent');
        const winnerAvatar = document.getElementById('winnerAvatar');
        const winnerIcon = document.getElementById('winnerIcon');
        const modalTitle = document.getElementById('modalTitle');
        const modalSubtitle = document.getElementById('modalSubtitle');
        const modalNextRoundBtn = document.getElementById('modalNextRoundBtn');
        const modalCloseBtn = document.getElementById('modalCloseBtn');

        // Build Board and Indicator UI
        function initBoardUI() {
            gridBoard.innerHTML = '';
            indicatorTrack.innerHTML = '';

            // Generate Top Indicator Slots
            for (let c = 0; c < COLS; c++) {
                const indCell = document.createElement('div');
                indCell.className = `indicator-cell flex justify-center items-center h-full cursor-pointer opacity-0 transition-opacity duration-150`;
                indCell.dataset.col = c;
                indCell.innerHTML = `<div class="w-6 h-6 sm:w-8 sm:h-8 rounded-full shadow-lg border-2 border-white/20 transform -translate-y-1"></div>`;
                indicatorTrack.appendChild(indCell);
            }

            // Generate Columns with 6 Slots each
            for (let c = 0; c < COLS; c++) {
                const colEl = document.createElement('div');
                colEl.className = `col-container flex flex-col gap-1 sm:gap-2 cursor-pointer group`;
                colEl.dataset.col = c;

                // Event Listeners for Column Selection
                colEl.addEventListener('mouseenter', () => handleColumnHover(c, true));
                colEl.addEventListener('mouseleave', () => handleColumnHover(c, false));
                colEl.addEventListener('click', () => handleColumnClick(c));

                for (let r = 0; r < ROWS; r++) {
                    const slot = document.createElement('div');
                    slot.className = `slot w-full aspect-square rounded-full bg-slate-900 dark:bg-slate-950 border-2 border-blue-800/40 dark:border-slate-800 shadow-inner flex items-center justify-center relative overflow-hidden`;
                    slot.dataset.row = r;
                    slot.dataset.col = c;
                    colEl.appendChild(slot);
                }

                gridBoard.appendChild(colEl);
            }

            // Hover listening on indicator track directly for touch/mouse
            indicatorTrack.querySelectorAll('.indicator-cell').forEach(cell => {
                const col = parseInt(cell.dataset.col);
                cell.addEventListener('mouseenter', () => handleColumnHover(col, true));
                cell.addEventListener('mouseleave', () => handleColumnHover(col, false));
                cell.addEventListener('click', () => handleColumnClick(col));
            });
        }

        // Show column hover disc preview
        function handleColumnHover(colIndex, isHovering) {
            if (!state.isGameActive || state.isAnimating) return;

            const indicators = indicatorTrack.children;
            for (let i = 0; i < COLS; i++) {
                if (i === colIndex && isHovering) {
                    const indDisc = indicators[i].querySelector('div');
                    indDisc.className = `w-6 h-6 sm:w-8 sm:h-8 rounded-full shadow-lg border-2 border-white/30 transform -translate-y-1 ${
                        state.currentPlayer === 1 
                            ? 'bg-p1 shadow-red-500/50' 
                            : 'bg-p2 shadow-yellow-500/50'
                    }`;
                    indicators[i].classList.remove('opacity-0');
                    indicators[i].classList.add('opacity-100');
                } else {
                    indicators[i].classList.add('opacity-0');
                    indicators[i].classList.remove('opacity-100');
                }
            }
        }

        // Handle User Dropping a Token into Column
        async function handleColumnClick(col) {
            if (!state.isGameActive || state.isAnimating) return;

            // Find lowest available row in column
            let targetRow = -1;
            for (let r = ROWS - 1; r >= 0; r--) {
                if (state.grid[r][col] === null) {
                    targetRow = r;
                    break;
                }
            }

            // Column full
            if (targetRow === -1) return;

            // Lock input while animating
            state.isAnimating = true;

            // Record State
            state.grid[targetRow][col] = state.currentPlayer;
            state.moveHistory.push({ player: state.currentPlayer, col, row: targetRow });

            // Animate Drop visually
            await animateDiscDrop(col, targetRow, state.currentPlayer);

            audio.playDrop();

            // Render Static Cell Disc
            renderDiscSlot(col, targetRow, state.currentPlayer);

            // Update History List
            updateMoveHistoryUI();

            // Check Win or Draw
            const winResult = checkWin(state.grid);
            if (winResult) {
                handleWin(winResult);
            } else if (state.moveHistory.length === ROWS * COLS) {
                handleDraw();
            } else {
                // Switch Turn
                state.currentPlayer = state.currentPlayer === 1 ? 2 : 1;
                updateTurnUI();
                handleColumnHover(col, true); // Refresh hover indicator color
            }

            state.isAnimating = false;
        }

        // Animate Disc Dropping Down Column
        function animateDiscDrop(col, row, player) {
            return new Promise((resolve) => {
                const targetColumn = gridBoard.children[col];
                const targetSlot = targetColumn.children[row];

                // Create floating animation element
                const tempDisc = document.createElement('div');
                const discColorClass = player === 1 
                    ? 'bg-gradient-to-tr from-red-600 to-p1 shadow-[0_0_15px_rgba(239,68,68,0.7)]' 
                    : 'bg-gradient-to-tr from-yellow-600 to-p2 shadow-[0_0_15px_rgba(234,179,8,0.7)]';
                
                tempDisc.className = `absolute inset-1 rounded-full ${discColorClass} z-20 border-2 border-white/30 animate-drop`;

                // Calculate vertical distance to animate from top
                const slotHeight = targetSlot.offsetHeight;
                const dropDistance = (row + 1) * (slotHeight + 8); // approximate padding/gap
                tempDisc.style.setProperty('--drop-start', `-${dropDistance}px`);

                targetSlot.appendChild(tempDisc);

                setTimeout(() => {
                    tempDisc.remove();
                    resolve();
                }, 520);
            });
        }

        // Render Permanent Disc into Cell
        function renderDiscSlot(col, row, player) {
            const targetColumn = gridBoard.children[col];
            const targetSlot = targetColumn.children[row];
            targetSlot.innerHTML = '';

            const disc = document.createElement('div');
            const colorClass = player === 1 
                ? 'bg-gradient-to-tr from-red-600 to-p1 border-p1 shadow-[0_0_12px_rgba(239,68,68,0.6)]' 
                : 'bg-gradient-to-tr from-yellow-600 to-p2 border-p2 shadow-[0_0_12px_rgba(234,179,8,0.6)]';

            disc.className = `w-full h-full rounded-full ${colorClass} border-2 border-white/20 transform scale-90 transition-all duration-200`;
            targetSlot.appendChild(disc);
        }

        // Check for 4-in-a-row (Horizontal, Vertical, Diagonal)
        function checkWin(board) {
            // Horizontal
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c <= COLS - 4; c++) {
                    const p = board[r][c];
                    if (p && p === board[r][c+1] && p === board[r][c+2] && p === board[r][c+3]) {
                        return { winner: p, combo: [[r, c], [r, c+1], [r, c+2], [r, c+3]] };
                    }
                }
            }

            // Vertical
            for (let r = 0; r <= ROWS - 4; r++) {
                for (let c = 0; c < COLS; c++) {
                    const p = board[r][c];
                    if (p && p === board[r+1][c] && p === board[r+2][c] && p === board[r+3][c]) {
                        return { winner: p, combo: [[r, c], [r+1, c], [r+2, c], [r+3, c]] };
                    }
                }
            }

            // Diagonal Up-Right
            for (let r = 3; r < ROWS; r++) {
                for (let c = 0; c <= COLS - 4; c++) {
                    const p = board[r][c];
                    if (p && p === board[r-1][c+1] && p === board[r-2][c+2] && p === board[r-3][c+3]) {
                        return { winner: p, combo: [[r, c], [r-1, c+1], [r-2, c+2], [r-3, c+3]] };
                    }
                }
            }

            // Diagonal Down-Right
            for (let r = 0; r <= ROWS - 4; r++) {
                for (let c = 0; c <= COLS - 4; c++) {
                    const p = board[r][c];
                    if (p && p === board[r+1][c+1] && p === board[r+2][c+2] && p === board[r+3][c+3]) {
                        return { winner: p, combo: [[r, c], [r+1, c+1], [r+2, c+2], [r+3, c+3]] };
                    }
                }
            }

            return null;
        }

        // Handle Game Victory
        function handleWin(winResult) {
            state.isGameActive = false;
            const winner = winResult.winner;
            state.scores[winner === 1 ? 'p1' : 'p2']++;
            updateScoresUI();

            // Highlight Winning Slots
            winResult.combo.forEach(([r, c]) => {
                const slot = gridBoard.children[c].children[r];
                const disc = slot.querySelector('div');
                if (disc) {
                    disc.classList.add('winning-disc');
                    disc.style.color = winner === 1 ? '#EF4444' : '#EAB308';
                }
            });

            audio.playWin();
            launchConfetti();

            setTimeout(() => {
                showModal(
                    `${state.playerNames[winner]} Wins!`,
                    `Connected 4 discs in a row! Excellent strategy!`,
                    winner
                );
            }, 600);
        }

        // Handle Draw Match
        function handleDraw() {
            state.isGameActive = false;
            state.scores.ties++;
            updateScoresUI();
            audio.playDraw();

            setTimeout(() => {
                showModal("It's a Draw!", "The board is completely full. Great match!", 'DRAW');
            }, 400);
        }

        // Update Turn Indicators
        function updateTurnUI() {
            const isP1 = state.currentPlayer === 1;
            turnText.textContent = state.playerNames[state.currentPlayer];

            if (isP1) {
                turnBadge.className = "mt-1 px-2.5 sm:px-3 py-1 rounded-full text-xs font-extrabold bg-p1/20 text-p1 border border-p1/40 flex items-center gap-1.5 transition-all duration-300";
                turnDot.className = "w-2.5 h-2.5 rounded-full bg-p1 animate-pulse";
                p1Card.classList.add('border-p1/80', 'opacity-100');
                p1Card.classList.remove('border-transparent', 'opacity-60');
                p2Card.classList.add('border-transparent', 'opacity-60');
                p2Card.classList.remove('border-p2/80', 'opacity-100');
            } else {
                turnBadge.className = "mt-1 px-2.5 sm:px-3 py-1 rounded-full text-xs font-extrabold bg-p2/20 text-p2 border border-p2/40 flex items-center gap-1.5 transition-all duration-300";
                turnDot.className = "w-2.5 h-2.5 rounded-full bg-p2 animate-pulse";
                p2Card.classList.add('border-p2/80', 'opacity-100');
                p2Card.classList.remove('border-transparent', 'opacity-60');
                p1Card.classList.add('border-transparent', 'opacity-60');
                p1Card.classList.remove('border-p1/80', 'opacity-100');
            }
        }

        // Update Score Counts UI
        function updateScoresUI() {
            p1ScoreEl.textContent = state.scores.p1;
            p2ScoreEl.textContent = state.scores.p2;
            tiesScoreEl.textContent = state.scores.ties;
        }

        // Update Move History Log List
        function updateMoveHistoryUI() {
            const len = state.moveHistory.length;
            moveCountBadge.textContent = `${len} Move${len === 1 ? '' : 's'}`;
            undoBtn.disabled = len === 0 || !state.isGameActive;

            if (len === 0) {
                moveHistoryList.innerHTML = `<div class="text-slate-500 italic text-center py-6">No moves made yet</div>`;
                return;
            }

            moveHistoryList.innerHTML = state.moveHistory.map((move, idx) => {
                const isP1 = move.player === 1;
                const pColor = isP1 ? 'text-p1' : 'text-p2';
                const pName = state.playerNames[move.player];
                return `
                    <div class="flex items-center justify-between bg-slate-900/60 dark:bg-slate-950/60 p-2 rounded-xl border border-slate-700/50">
                        <div class="flex items-center gap-2">
                            <span class="text-[10px] text-slate-500 font-mono">#${idx + 1}</span>
                            <span class="font-bold ${pColor} truncate max-w-[90px]">${pName}</span>
                        </div>
                        <span class="text-slate-400 font-mono text-[11px]">Col ${move.col + 1}, Row ${6 - move.row}</span>
                    </div>
                `;
            }).reverse().join('');
        }

        // Undo Last Played Move
        function undoLastMove() {
            if (state.moveHistory.length === 0 || state.isAnimating) return;
            audio.playClick();

            const lastMove = state.moveHistory.pop();
            state.grid[lastMove.row][lastMove.col] = null;

            // Clear Slot UI
            const slot = gridBoard.children[lastMove.col].children[lastMove.row];
            slot.innerHTML = '';

            // Switch Turn back
            state.currentPlayer = lastMove.player;
            state.isGameActive = true;

            updateTurnUI();
            updateMoveHistoryUI();
        }

        // Reset Current Board Round
        function resetBoard() {
            audio.playClick();
            state.grid = Array(ROWS).fill(null).map(() => Array(COLS).fill(null));
            state.moveHistory = [];
            state.isGameActive = true;
            state.isAnimating = false;
            state.currentPlayer = 1;

            initBoardUI();
            updateTurnUI();
            updateMoveHistoryUI();
            hideModal();
        }

        // Reset Entire Match & Scores
        function resetMatch() {
            state.scores = { p1: 0, p2: 0, ties: 0 };
            updateScoresUI();
            resetBoard();
        }

        // Modal Display Controls
        function showModal(title, subtitle, type) {
            modalTitle.textContent = title;
            modalSubtitle.textContent = subtitle;

            if (type === 1) {
                winnerAvatar.className = "w-20 h-20 mx-auto rounded-3xl flex items-center justify-center text-4xl mb-4 bg-p1/20 text-p1 border border-p1/40 shadow-lg shadow-red-500/20";
                winnerIcon.className = "fas fa-trophy";
            } else if (type === 2) {
                winnerAvatar.className = "w-20 h-20 mx-auto rounded-3xl flex items-center justify-center text-4xl mb-4 bg-p2/20 text-p2 border border-p2/40 shadow-lg shadow-yellow-500/20";
                winnerIcon.className = "fas fa-trophy";
            } else {
                winnerAvatar.className = "w-20 h-20 mx-auto rounded-3xl flex items-center justify-center text-4xl mb-4 bg-slate-700 text-slate-300 border border-slate-600 shadow-lg";
                winnerIcon.className = "fas fa-handshake";
            }

            gameModal.classList.remove('opacity-0', 'pointer-events-none');
            modalContent.classList.remove('scale-90');
            modalContent.classList.add('scale-100');
        }

        function hideModal() {
            gameModal.classList.add('opacity-0', 'pointer-events-none');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-90');
        }

        // Particle Confetti Effect
        function launchConfetti() {
            const canvas = document.getElementById('confettiCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const colors = ['#EF4444', '#EAB308', '#3B82F6', '#10B981', '#8B5CF6'];

            for (let i = 0; i < 110; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 16,
                    vy: (Math.random() - 0.7) * 16,
                    size: Math.random() * 8 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rotation: Math.random() * 360,
                    vRot: (Math.random() - 0.5) * 10,
                    life: 1
                });
            }

            function renderParticles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let alive = false;

                particles.forEach(p => {
                    if (p.life > 0) {
                        alive = true;
                        p.x += p.vx;
                        p.y += p.vy;
                        p.vy += 0.35; // gravity
                        p.rotation += p.vRot;
                        p.life -= 0.015;

                        ctx.save();
                        ctx.translate(p.x, p.y);
                        ctx.rotate((p.rotation * Math.PI) / 180);
                        ctx.globalAlpha = Math.max(p.life, 0);
                        ctx.fillStyle = p.color;
                        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                        ctx.restore();
                    }
                });

                if (alive) {
                    requestAnimationFrame(renderParticles);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }

            renderParticles();
        }

        // Toggle Audio Effects
        function toggleSound() {
            state.soundEnabled = !state.soundEnabled;
            soundIcon.className = state.soundEnabled ? "fas fa-volume-up text-lg" : "fas fa-volume-mute text-lg text-slate-500";
        }

        // Toggle Dark / Light Visual Theme
        function toggleTheme() {
            state.theme = state.theme === 'dark' ? 'light' : 'dark';
            const body = document.body;

            if (state.theme === 'light') {
                document.documentElement.classList.remove('dark');
                body.className = "bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-between transition-colors duration-300 relative overflow-x-hidden";
                themeIcon.className = "fas fa-moon text-lg text-indigo-600";
            } else {
                document.documentElement.classList.add('dark');
                body.className = "bg-slate-900 text-slate-100 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col justify-between transition-colors duration-300 relative overflow-x-hidden";
                themeIcon.className = "fas fa-sun text-lg text-amber-400";
            }
        }

        // Input Handlers for Renaming
        p1NameInput.addEventListener('change', (e) => {
            state.playerNames[1] = e.target.value.trim() || 'Player 1';
            updateTurnUI();
        });

        p2NameInput.addEventListener('change', (e) => {
            state.playerNames[2] = e.target.value.trim() || 'Player 2';
            updateTurnUI();
        });

        // Event Listeners for Controls
        undoBtn.addEventListener('click', undoLastMove);
        restartBoardBtn.addEventListener('click', resetBoard);
        resetMatchBtn.addEventListener('click', resetMatch);
        modalNextRoundBtn.addEventListener('click', resetBoard);
        modalCloseBtn.addEventListener('click', hideModal);
        soundToggleBtn.addEventListener('click', toggleSound);
        themeToggleBtn.addEventListener('click', toggleTheme);

        // Resize Canvas on Window Resize
        window.addEventListener('resize', () => {
            const canvas = document.getElementById('confettiCanvas');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // App Initialization
        window.onload = () => {
            initBoardUI();
            updateTurnUI();
            updateScoresUI();
        };
    </script>
</body>
</html>
