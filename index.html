<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            x: '#3B82F6', // Vibrant Blue
                            o: '#EC4899', // Vibrant Pink
                            accent: '#8B5CF6', // Purple Accent
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        .cell-hover:hover {
            transform: scale(0.98);
        }

        /* SVG Win Line Animation */
        .win-line {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: stroke 0.5s ease-in-out forwards;
        }

        @keyframes stroke {
            to {
                stroke-dashoffset: 0;
            }
        }

        /* X and O Pop Animation */
        .symbol-pop {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0) rotate(-15deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        /* Glassmorphism effects */
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-light {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 0, 0, 0.08);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 dark:bg-slate-900 dark:text-slate-100 min-h-screen flex flex-col justify-between transition-colors duration-300">

    <!-- Header -->
    <header class="w-full max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-x to-brand-o flex items-center justify-center text-white font-extrabold text-xl shadow-lg shadow-purple-500/20">
                XO
            </div>
            <h1 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-brand-x via-brand-accent to-brand-o">
                TicTacToe Pro
            </h1>
        </div>
        
        <!-- Controls: Sound & Theme Toggle -->
        <div class="flex items-center gap-3">
            <button id="soundToggleBtn" class="p-3 rounded-xl bg-slate-800 hover:bg-slate-700 dark:bg-slate-800 dark:hover:bg-slate-700 border border-slate-700 text-slate-300 transition-all shadow-md focus:outline-none" title="Toggle Sound">
                <i id="soundIcon" class="fas fa-volume-up text-lg"></i>
            </button>
            <button id="themeToggleBtn" class="p-3 rounded-xl bg-slate-800 hover:bg-slate-700 dark:bg-slate-800 dark:hover:bg-slate-700 border border-slate-700 text-slate-300 transition-all shadow-md focus:outline-none" title="Toggle Dark/Light Mode">
                <i id="themeIcon" class="fas fa-sun text-lg text-amber-400"></i>
            </button>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="w-full max-w-4xl mx-auto px-4 py-2 flex-grow flex flex-col justify-center items-center gap-6">
        
        <!-- Scoreboard & Players Section -->
        <div class="w-full grid grid-cols-3 gap-3 md:gap-6 items-center">
            
            <!-- Player X Card -->
            <div id="playerXCard" class="p-4 rounded-2xl transition-all duration-300 border-2 border-brand-x/40 bg-slate-800/60 flex flex-col items-center justify-center relative overflow-hidden shadow-lg">
                <div class="absolute top-0 left-0 w-full h-1 bg-brand-x"></div>
                <div class="flex items-center gap-2 mb-1 w-full justify-center">
                    <span class="text-brand-x font-black text-xl">X</span>
                    <input type="text" id="playerXName" value="Player 1" class="bg-transparent border-b border-transparent hover:border-slate-500 focus:border-brand-x focus:outline-none text-center font-semibold text-sm md:text-base text-slate-200 w-24 md:w-32 truncate" title="Click to rename">
                    <i class="fas fa-pen text-xs text-slate-500 opacity-50"></i>
                </div>
                <div class="text-2xl md:text-4xl font-extrabold text-slate-100" id="scoreX">0</div>
                <span class="text-xs text-slate-400 font-medium mt-1">WINS</span>
            </div>

            <!-- Ties / Game Info Center -->
            <div class="p-3 rounded-2xl bg-slate-800/40 border border-slate-700/50 flex flex-col items-center justify-center text-center">
                <span class="text-xs font-bold tracking-wider text-slate-400 uppercase">Ties</span>
                <div class="text-xl md:text-3xl font-extrabold text-slate-300 my-1" id="scoreTies">0</div>
                <div id="turnBadge" class="mt-1 px-3 py-1 rounded-full text-xs font-bold bg-brand-x/20 text-brand-x border border-brand-x/30 flex items-center gap-1.5 transition-all duration-300">
                    <span id="turnSymbol" class="font-extrabold">X</span>'s Turn
                </div>
            </div>

            <!-- Player O Card -->
            <div id="playerOCard" class="p-4 rounded-2xl transition-all duration-300 border-2 border-transparent bg-slate-800/60 opacity-60 flex flex-col items-center justify-center relative overflow-hidden shadow-lg">
                <div class="absolute top-0 left-0 w-full h-1 bg-brand-o"></div>
                <div class="flex items-center gap-2 mb-1 w-full justify-center">
                    <span class="text-brand-o font-black text-xl">O</span>
                    <input type="text" id="playerOName" value="Player 2" class="bg-transparent border-b border-transparent hover:border-slate-500 focus:border-brand-o focus:outline-none text-center font-semibold text-sm md:text-base text-slate-200 w-24 md:w-32 truncate" title="Click to rename">
                    <i class="fas fa-pen text-xs text-slate-500 opacity-50"></i>
                </div>
                <div class="text-2xl md:text-4xl font-extrabold text-slate-100" id="scoreO">0</div>
                <span class="text-xs text-slate-400 font-medium mt-1">WINS</span>
            </div>
        </div>

        <!-- Interactive Game Area -->
        <div class="flex flex-col lg:flex-row gap-6 items-start justify-center w-full">
            
            <!-- Game Board Container -->
            <div class="relative mx-auto bg-slate-800/80 p-3 md:p-4 rounded-3xl border border-slate-700/80 shadow-2xl">
                <!-- 3x3 Grid -->
                <div id="board" class="grid grid-cols-3 gap-2 md:gap-3 w-[290px] h-[290px] sm:w-[360px] sm:h-[360px] md:w-[420px] md:h-[420px]">
                    <!-- Cells dynamically generated via JavaScript -->
                </div>

                <!-- SVG Overlay for Win Line Rendering -->
                <svg id="winLineSvg" class="absolute inset-0 w-full h-full pointer-events-none p-3 md:p-4 z-20" xmlns="http://www.w3.org/2000/svg">
                    <line id="winLine" x1="0" y1="0" x2="0" y2="0" stroke="currentColor" stroke-width="8" stroke-linecap="round" class="hidden text-amber-400 drop-shadow-[0_0_10px_rgba(251,191,36,0.8)]" />
                </svg>
            </div>

            <!-- Move Log / Game History Sidebar -->
            <div class="w-full lg:w-64 bg-slate-800/40 rounded-2xl border border-slate-700/50 p-4 flex flex-col h-[180px] lg:h-[452px]">
                <div class="flex items-center justify-between border-b border-slate-700/60 pb-2 mb-2">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2">
                        <i class="fas fa-history"></i> Move History
                    </h3>
                    <span id="moveCounter" class="text-xs font-semibold bg-slate-700 text-slate-300 px-2 py-0.5 rounded-full">0 Moves</span>
                </div>
                
                <div id="moveLogList" class="flex-grow overflow-y-auto space-y-1.5 pr-1 text-xs md:text-sm font-medium text-slate-300">
                    <div class="text-slate-500 italic text-center py-4">No moves yet</div>
                </div>

                <!-- Reset Board Buttons -->
                <div class="pt-3 border-t border-slate-700/60 flex gap-2">
                    <button id="resetBoardBtn" class="flex-1 py-2.5 px-3 rounded-xl bg-slate-700 hover:bg-slate-600 text-slate-100 font-semibold text-xs transition-all shadow active:scale-95 flex items-center justify-center gap-1.5">
                        <i class="fas fa-redo-alt"></i> Reset Board
                    </button>
                    <button id="resetMatchBtn" class="py-2.5 px-3 rounded-xl bg-rose-600/20 hover:bg-rose-600/30 text-rose-300 border border-rose-500/30 font-semibold text-xs transition-all active:scale-95 flex items-center justify-center" title="Reset Scores & Game">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                </div>
            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full text-center py-4 text-xs text-slate-500">
        Tic-Tac-Toe • 2 Players Local Gameplay
    </footer>

    <!-- Victory / Draw Modal Overlay -->
    <div id="gameModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-slate-800 border border-slate-700 rounded-3xl p-6 md:p-8 max-w-sm w-full text-center shadow-2xl transform scale-90 transition-transform duration-300" id="modalContent">
            
            <div id="winnerIconBg" class="w-20 h-20 mx-auto rounded-2xl flex items-center justify-center text-4xl mb-4 shadow-lg">
                <i id="winnerIcon" class="fas fa-trophy"></i>
            </div>

            <h2 id="modalTitle" class="text-2xl font-black text-slate-100 mb-1">Player X Wins!</h2>
            <p id="modalSubtitle" class="text-sm text-slate-400 mb-6">Congratulations on a great match!</p>

            <div class="flex flex-col gap-2">
                <button id="modalNextRoundBtn" class="w-full py-3.5 px-4 rounded-xl bg-gradient-to-r from-brand-x to-brand-accent text-white font-bold text-sm shadow-lg shadow-purple-500/25 hover:opacity-95 transition-all active:scale-95">
                    Next Round
                </button>
                <button id="modalCloseBtn" class="w-full py-2.5 px-4 rounded-xl bg-slate-700 hover:bg-slate-600 text-slate-300 font-semibold text-xs transition-all">
                    Close Preview
                </button>
            </div>
        </div>
    </div>

    <script>
        // Game Configuration & State
        const state = {
            board: Array(9).fill(null),
            currentPlayer: 'X', // 'X' or 'O'
            scores: { X: 0, O: 0, ties: 0 },
            playerNames: { X: 'Player 1', O: 'Player 2' },
            isGameActive: true,
            moveHistory: [],
            soundEnabled: true,
            theme: 'dark'
        };

        // Winning Combinations
        const WINNING_COMBOS = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // Rows
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // Columns
            [0, 4, 8], [2, 4, 6]             // Diagonals
        ];

        // Web Audio API Synthesizer
        class SoundEffects {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) {
                        this.ctx = new AudioContext();
                    }
                }
            }

            playClick(symbol) {
                if (!state.soundEnabled) return;
                this.init();
                if (!this.ctx) return;

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);

                // Pitch based on X or O
                osc.type = 'sine';
                osc.frequency.setValueAtTime(symbol === 'X' ? 440 : 554.37, this.ctx.currentTime); // A4 or C#5
                
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.15);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            }

            playWin() {
                if (!state.soundEnabled) return;
                this.init();
                if (!this.ctx) return;

                const notes = [523.25, 659.25, 783.99, 1046.50]; // C Major Arpeggio
                notes.forEach((freq, index) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime + index * 0.08);

                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime + index * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + index * 0.08 + 0.3);

                    osc.start(this.ctx.currentTime + index * 0.08);
                    osc.stop(this.ctx.currentTime + index * 0.08 + 0.3);
                });
            }

            playDraw() {
                if (!state.soundEnabled) return;
                this.init();
                if (!this.ctx) return;

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(150, this.ctx.currentTime + 0.3);

                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.3);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            }
        }

        const sfx = new SoundEffects();

        // DOM Elements
        const boardEl = document.getElementById('board');
        const turnBadge = document.getElementById('turnBadge');
        const turnSymbol = document.getElementById('turnSymbol');
        const playerXCard = document.getElementById('playerXCard');
        const playerOCard = document.getElementById('playerOCard');
        const playerXNameInput = document.getElementById('playerXName');
        const playerONameInput = document.getElementById('playerOName');
        const scoreXEl = document.getElementById('scoreX');
        const scoreOEl = document.getElementById('scoreO');
        const scoreTiesEl = document.getElementById('scoreTies');
        const moveLogList = document.getElementById('moveLogList');
        const moveCounter = document.getElementById('moveCounter');
        const winLineSvg = document.getElementById('winLineSvg');
        const winLine = document.getElementById('winLine');
        
        // Modal DOM
        const gameModal = document.getElementById('gameModal');
        const modalContent = document.getElementById('modalContent');
        const winnerIconBg = document.getElementById('winnerIconBg');
        const winnerIcon = document.getElementById('winnerIcon');
        const modalTitle = document.getElementById('modalTitle');
        const modalSubtitle = document.getElementById('modalSubtitle');
        const modalNextRoundBtn = document.getElementById('modalNextRoundBtn');
        const modalCloseBtn = document.getElementById('modalCloseBtn');

        // Buttons DOM
        const resetBoardBtn = document.getElementById('resetBoardBtn');
        const resetMatchBtn = document.getElementById('resetMatchBtn');
        const soundToggleBtn = document.getElementById('soundToggleBtn');
        const soundIcon = document.getElementById('soundIcon');
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const themeIcon = document.getElementById('themeIcon');

        // Initialize Game Board Cells
        function createBoard() {
            boardEl.innerHTML = '';
            for (let i = 0; i < 9; i++) {
                const cell = document.createElement('button');
                cell.className = `cell-hover bg-slate-800/90 hover:bg-slate-700/80 rounded-2xl flex items-center justify-center text-4xl sm:text-5xl font-black transition-all duration-200 border border-slate-700/50 shadow-inner focus:outline-none`;
                cell.setAttribute('data-index', i);
                cell.setAttribute('aria-label', `Cell ${i + 1}`);
                cell.addEventListener('click', () => handleCellClick(i));
                boardEl.appendChild(cell);
            }
        }

        // Handle User Click on Cell
        function handleCellClick(index) {
            if (state.board[index] !== null || !state.isGameActive) return;

            // Make Move
            state.board[index] = state.currentPlayer;
            const cell = boardEl.children[index];
            
            // Play Audio
            sfx.playClick(state.currentPlayer);

            // Render Mark with Animation
            renderCell(cell, state.currentPlayer);

            // Record History
            const row = Math.floor(index / 3) + 1;
            const col = (index % 3) + 1;
            const moveText = `${state.playerNames[state.currentPlayer]} (${state.currentPlayer}) -> Row ${row}, Col ${col}`;
            state.moveHistory.push({ player: state.currentPlayer, moveText });
            updateMoveLog();

            // Check Win or Draw
            const winCombo = checkWin();
            if (winCombo) {
                handleWin(winCombo);
            } else if (state.board.every(cell => cell !== null)) {
                handleDraw();
            } else {
                // Switch Turn
                state.currentPlayer = state.currentPlayer === 'X' ? 'O' : 'X';
                updateTurnUI();
            }
        }

        // Render Cell UI
        function renderCell(cell, symbol) {
            const isX = symbol === 'X';
            cell.innerHTML = `<span class="${isX ? 'text-brand-x' : 'text-brand-o'} symbol-pop">${symbol}</span>`;
            cell.classList.remove('cell-hover');
            cell.classList.add('cursor-default');
        }

        // Check Winning Condition
        function checkWin() {
            for (const combo of WINNING_COMBOS) {
                const [a, b, c] = combo;
                if (state.board[a] && state.board[a] === state.board[b] && state.board[a] === state.board[c]) {
                    return combo;
                }
            }
            return null;
        }

        // Draw Line SVG Over Winning Cells
        function drawWinLine(combo) {
            const boardRect = boardEl.getBoundingClientRect();
            const firstCellRect = boardEl.children[combo[0]].getBoundingClientRect();
            const lastCellRect = boardEl.children[combo[2]].getBoundingClientRect();

            // Calculate center points relative to board
            const x1 = (firstCellRect.left + firstCellRect.width / 2) - boardRect.left;
            const y1 = (firstCellRect.top + firstCellRect.height / 2) - boardRect.top;
            const x2 = (lastCellRect.left + lastCellRect.width / 2) - boardRect.left;
            const y2 = (lastCellRect.top + lastCellRect.height / 2) - boardRect.top;

            winLine.setAttribute('x1', x1);
            winLine.setAttribute('y1', y1);
            winLine.setAttribute('x2', x2);
            winLine.setAttribute('y2', y2);

            // Set color based on winner
            const winnerSymbol = state.board[combo[0]];
            if (winnerSymbol === 'X') {
                winLine.setAttribute('class', 'win-line text-brand-x drop-shadow-[0_0_12px_rgba(59,130,246,0.8)]');
            } else {
                winLine.setAttribute('class', 'win-line text-brand-o drop-shadow-[0_0_12px_rgba(236,72,153,0.8)]');
            }
        }

        // Handle Victory state
        function handleWin(winCombo) {
            state.isGameActive = false;
            const winner = state.currentPlayer;
            state.scores[winner]++;
            updateScoresUI();
            drawWinLine(winCombo);

            // Highlight Winning Cells
            winCombo.forEach(idx => {
                boardEl.children[idx].classList.add('bg-slate-700/90', 'ring-2', winner === 'X' ? 'ring-brand-x' : 'ring-brand-o');
            });

            sfx.playWin();

            // Delay showing victory modal for visual effect
            setTimeout(() => {
                showModal(
                    `${state.playerNames[winner]} Wins!`,
                    `Awesome game! ${state.playerNames[winner]} played as ${winner}.`,
                    winner
                );
            }, 700);
        }

        // Handle Draw state
        function handleDraw() {
            state.isGameActive = false;
            state.scores.ties++;
            updateScoresUI();
            sfx.playDraw();

            setTimeout(() => {
                showModal("It's a Draw!", "Nobody won this round. Ready for a rematch?", 'TIE');
            }, 400);
        }

        // Update Turn Indicator UI
        function updateTurnUI() {
            const isX = state.currentPlayer === 'X';
            turnSymbol.textContent = state.currentPlayer;

            if (isX) {
                turnBadge.className = "mt-1 px-3 py-1 rounded-full text-xs font-bold bg-brand-x/20 text-brand-x border border-brand-x/30 flex items-center gap-1.5 transition-all duration-300";
                playerXCard.classList.add('border-brand-x/50', 'opacity-100');
                playerXCard.classList.remove('border-transparent', 'opacity-60');
                playerOCard.classList.add('border-transparent', 'opacity-60');
                playerOCard.classList.remove('border-brand-o/50', 'opacity-100');
            } else {
                turnBadge.className = "mt-1 px-3 py-1 rounded-full text-xs font-bold bg-brand-o/20 text-brand-o border border-brand-o/30 flex items-center gap-1.5 transition-all duration-300";
                playerOCard.classList.add('border-brand-o/50', 'opacity-100');
                playerOCard.classList.remove('border-transparent', 'opacity-60');
                playerXCard.classList.add('border-transparent', 'opacity-60');
                playerXCard.classList.remove('border-brand-x/50', 'opacity-100');
            }
        }

        // Update Scores Display
        function updateScoresUI() {
            scoreXEl.textContent = state.scores.X;
            scoreOEl.textContent = state.scores.O;
            scoreTiesEl.textContent = state.scores.ties;
        }

        // Update Move Log Display
        function updateMoveLog() {
            moveCounter.textContent = `${state.moveHistory.length} Move${state.moveHistory.length === 1 ? '' : 's'}`;
            if (state.moveHistory.length === 0) {
                moveLogList.innerHTML = `<div class="text-slate-500 italic text-center py-4">No moves yet</div>`;
                return;
            }

            moveLogList.innerHTML = state.moveHistory.map((item, index) => {
                const color = item.player === 'X' ? 'text-brand-x' : 'text-brand-o';
                return `
                    <div class="flex items-center gap-2 bg-slate-800/60 p-2 rounded-lg border border-slate-700/40">
                        <span class="text-[10px] text-slate-500 font-mono">#${index + 1}</span>
                        <span class="font-bold ${color}">${item.player}</span>
                        <span class="truncate text-slate-300">${item.moveText.split('->')[1]}</span>
                    </div>
                `;
            }).reverse().join('');
        }

        // Display Outcome Modal
        function showModal(title, subtitle, type) {
            modalTitle.textContent = title;
            modalSubtitle.textContent = subtitle;

            if (type === 'X') {
                winnerIconBg.className = "w-20 h-20 mx-auto rounded-2xl flex items-center justify-center text-4xl mb-4 bg-brand-x/20 text-brand-x border border-brand-x/30 shadow-lg shadow-blue-500/10";
                winnerIcon.className = "fas fa-trophy";
            } else if (type === 'O') {
                winnerIconBg.className = "w-20 h-20 mx-auto rounded-2xl flex items-center justify-center text-4xl mb-4 bg-brand-o/20 text-brand-o border border-brand-o/30 shadow-lg shadow-pink-500/10";
                winnerIcon.className = "fas fa-trophy";
            } else {
                winnerIconBg.className = "w-20 h-20 mx-auto rounded-2xl flex items-center justify-center text-4xl mb-4 bg-slate-700 text-slate-300 border border-slate-600 shadow-lg";
                winnerIcon.className = "fas fa-handshake";
            }

            gameModal.classList.remove('opacity-0', 'pointer-events-none');
            modalContent.classList.remove('scale-90');
            modalContent.classList.add('scale-100');
        }

        // Hide Outcome Modal
        function hideModal() {
            gameModal.classList.add('opacity-0', 'pointer-events-none');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-90');
        }

        // Reset Current Board
        function resetBoard() {
            state.board = Array(9).fill(null);
            state.isGameActive = true;
            state.moveHistory = [];
            state.currentPlayer = 'X';

            // Hide Win Line Line
            winLine.setAttribute('x1', '0');
            winLine.setAttribute('y1', '0');
            winLine.setAttribute('x2', '0');
            winLine.setAttribute('y2', '0');
            winLine.classList.add('hidden');

            createBoard();
            updateTurnUI();
            updateMoveLog();
            hideModal();
        }

        // Full Game Match Reset
        function resetMatch() {
            state.scores = { X: 0, O: 0, ties: 0 };
            updateScoresUI();
            resetBoard();
        }

        // Toggle Sound Effects
        function toggleSound() {
            state.soundEnabled = !state.soundEnabled;
            soundIcon.className = state.soundEnabled ? "fas fa-volume-up text-lg" : "fas fa-volume-mute text-lg text-slate-500";
        }

        // Toggle Dark / Light Theme
        function toggleTheme() {
            state.theme = state.theme === 'dark' ? 'light' : 'dark';
            const body = document.body;

            if (state.theme === 'light') {
                document.documentElement.classList.remove('dark');
                body.className = "bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-between transition-colors duration-300";
                themeIcon.className = "fas fa-moon text-lg text-indigo-600";
            } else {
                document.documentElement.classList.add('dark');
                body.className = "bg-slate-900 text-slate-100 dark:bg-slate-900 dark:text-slate-100 min-h-screen flex flex-col justify-between transition-colors duration-300";
                themeIcon.className = "fas fa-sun text-lg text-amber-400";
            }
        }

        // Handle Dynamic Resizing for Win SVG line
        window.addEventListener('resize', () => {
            const winCombo = checkWin();
            if (winCombo && !state.isGameActive) {
                drawWinLine(winCombo);
            }
        });

        // Player Name Inputs Binding
        playerXNameInput.addEventListener('change', (e) => {
            state.playerNames.X = e.target.value.trim() || 'Player 1';
        });

        playerONameInput.addEventListener('change', (e) => {
            state.playerNames.O = e.target.value.trim() || 'Player 2';
        });

        // Action Buttons Event Listeners
        resetBoardBtn.addEventListener('click', resetBoard);
        resetMatchBtn.addEventListener('click', resetMatch);
        modalNextRoundBtn.addEventListener('click', resetBoard);
        modalCloseBtn.addEventListener('click', hideModal);
        soundToggleBtn.addEventListener('click', toggleSound);
        themeToggleBtn.addEventListener('click', toggleTheme);

        // App Initialization
        createBoard();
        updateTurnUI();
    </script>
</body>
</html>
